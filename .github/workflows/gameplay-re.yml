name: Reverse-engineer original TERSE gameplay graph
on:
  push:
    branches: [codex/baseball-gameplay-native-lineage]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  terse-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original source gameplay and music dependencies
        run: python3 tools/trace_gameplay_terse.py
      - name: Recover authentic 1980 target TERSE developer vocabulary
        run: python3 tools/recover_terse_vocabulary.py
      - name: Publish verified source-level RE artifacts to PR
        if: github.ref == 'refs/heads/codex/baseball-gameplay-native-lineage'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/terse-baseball-gameplay-graph.json docs/recovered-terse-original-vocabulary.json docs/recovered-terse-original-vocabulary.md
          if ! git diff --cached --quiet; then
            git commit -m "re: generated original TERSE developer vocabulary and gameplay graph [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Export extracted source-level graph
        uses: actions/upload-artifact@v4
        with:
          name: extra-bases-original-terse-gameplay-graph
          path: |
            docs/terse-baseball-gameplay-graph.json
            docs/recovered-terse-original-vocabulary.json
            docs/recovered-terse-original-vocabulary.md
          if-no-files-found: error
